# yaml-language-server: $schema=./assets/schema/henitai.schema.json
includes:
  - lib
# Process-boundary specs still run in the normal suite, but not inside mutant
# children. All other specs are verified to run without starting child
# processes so self-mutation keeps a flat, jobs-bounded worker tree.
test_excludes:
  - spec/**/*_process_spec.rb
reporters:
  - terminal
  - json
  - html
mutation:
  operators: light
  timeout: 10.0
  max_flaky_retries: 3
  sampling:
    ratio: 0.05
    strategy: stratified
reports_dir: reports
thresholds:
  high: 80
  low: 60
integration:
  name: rspec
