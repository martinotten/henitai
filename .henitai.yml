# yaml-language-server: $schema=./assets/schema/henitai.schema.json
includes:
  - lib
# Specs that themselves spawn henitai/forked subprocesses (the CLI end-to-end
# run and the process-scheduler / integration fork specs). Running them as a
# mutant's tests re-launches nested henitai process trees, multiplying
# processes, wall-clock and captured-log noise when dogfooding henitai on
# itself. Excluding them from per-mutant test selection keeps the fork tree
# flat; the trade-off is reduced mutation coverage of the CLI/execution
# subsystem during dogfood runs.
test_excludes:
  - spec/henitai/cli_spec.rb
  - spec/henitai/process_worker_runner_spec.rb
  - spec/henitai/slot_scheduler_spec.rb
  - spec/henitai/integration/rspec_spec.rb
  - spec/henitai/integration/rspec_process_runner_spec.rb
  - spec/henitai/integration/child_debug_support_spec.rb
mutation:
  operators: light
  timeout: 10.0
  max_flaky_retries: 3
  sampling:
    ratio: 0.05
    strategy: stratified
reports_dir: reports
thresholds:
  high: 80
  low: 60
integration:
  name: rspec
